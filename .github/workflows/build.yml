name: Docker Image CI

# Mirrors .gitlab-ci.yml: two variants (-api from ./Dockerfile, -argo from
# ./Dockerfile-argo), each built for amd64/arm64 on separate runners and merged
# into a multi-arch manifest.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: build ${{ matrix.variant }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: api
            dockerfile: ./Dockerfile
            platform: linux/amd64
            suffix: amd64
          - variant: api
            dockerfile: ./Dockerfile
            platform: linux/arm64
            suffix: arm64
          - variant: argo
            dockerfile: ./Dockerfile-argo
            platform: linux/amd64
            suffix: amd64
          - variant: argo
            dockerfile: ./Dockerfile-argo
            platform: linux/arm64
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.ACR_REGISTRY }}

      - name: Build and push per-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_CN=true
            PYTHON_IMAGE=${{ secrets.ACR_REGISTRY }}/opencsg_public/python:3.10.14
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/
          tags: |
            opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-${{ matrix.suffix }}
            ${{ secrets.ACR_REGISTRY }}/opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=dataflow-${{ matrix.variant }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dataflow-${{ matrix.variant }}-${{ matrix.suffix }}

  manifest:
    name: merge multi-arch manifest ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [api, argo]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.ACR_REGISTRY }}

      - name: Create and push multi-arch manifest to Docker Hub
        run: |
          docker buildx imagetools create \
            -t opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }} \
            opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-amd64 \
            opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-arm64

      - name: Create and push multi-arch manifest to ACR
        run: |
          docker buildx imagetools create \
            -t ${{ secrets.ACR_REGISTRY }}/opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }} \
            ${{ secrets.ACR_REGISTRY }}/opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-amd64 \
            ${{ secrets.ACR_REGISTRY }}/opencsghq/dataflow:${{ github.ref_name }}-${{ matrix.variant }}-arm64