services:

  dataflow_postgres_db:
    restart: unless-stopped
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/postgres:15.10
    volumes:
      - /dataflow_data/postgres_db_data:/var/lib/postgresql/data
    command: -p 5432
    environment:
      - POSTGRES_DB=data_flow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    networks:
      - csg-network

  dataflow_label_llm:
    container_name: ml-backend
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/label-studio:llm-20260914
    restart: unless-stopped
    environment:
      # specify these parameters if you want to use basic auth for the model server
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASS=${BASIC_AUTH_PASS:-}
      # set the log level for the model server
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # specify the number of workers and threads for the model server
      - WORKERS=${WORKERS:-1}
      - THREADS=${THREADS:-8}
      # specify the model directory (likely you don't need to change this)
      - MODEL_DIR=${MODEL_DIR:-/data/models}
      # specify device
      - DEVICE=${DEVICE:-cuda}
      # SAM2 model config
      - MODEL_CONFIG=${MODEL_CONFIG:-configs/sam2.1/sam2.1_hiera_l.yaml}
      # SAM2 checkpoint
      - MODEL_CHECKPOINT=${MODEL_CHECKPOINT:-sam2.1_hiera_large.pt}

      # Global model switch for every supported template. false keeps dedicated models.
      - USE_THIRD_PARTY_MODELS=${USE_THIRD_PARTY_MODELS:-true}
      - VOLCENGINE_ENTITY_SEGMENT_MODEL=${VOLCENGINE_ENTITY_SEGMENT_MODEL:-entity_seg}
      - VOLCENGINE_ENTITY_SEGMENT_MAX_ENTITY=${VOLCENGINE_ENTITY_SEGMENT_MAX_ENTITY:-10}
      - VOLCENGINE_ENTITY_SEGMENT_REFINE_MASK=${VOLCENGINE_ENTITY_SEGMENT_REFINE_MASK:-1}
      - VOLCENGINE_ENTITY_SEGMENT_RETURN_FORMAT=${VOLCENGINE_ENTITY_SEGMENT_RETURN_FORMAT:-3}
      - DOUBAO_MODEL=${DOUBAO_MODEL:-doubao-seed-2-1-turbo-260628}
      - ARK_BASE_URL=${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - DOUBAO_TIMEOUT=${DOUBAO_TIMEOUT:-360}
      - DOUBAO_MAX_IMAGE_SIZE=${DOUBAO_MAX_IMAGE_SIZE:-640}

      # Label Studio URL and the current user's JWT are supplied per request.
    ports:
      - "${ML_BACKEND_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/dataflow_data/llmback/data/segment_anything_2_image:/data"
      - "/dataflow_data/llmback/data/media:/label-studio-media:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dataflow_label_studio:
    stdin_open: true
    tty: true
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/label-studio:20251128
    restart: unless-stopped
    expose:
      - "8002"
    depends_on:
      - dataflow_postgres_db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=postgres
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=dataflow_postgres_db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - JSON_LOG=1
      - LABEL_STUDIO_HOST=0.0.0.0
      - CSGHUB_ENDPOINT= https://hub.opencsg-stg.com
      - LABEL_STUDIO_PORT=8002
    volumes:
      - /dataflow_data/label-studio:/label-studio/data:rw
    ports:
      - "8002:8002"
    command: label-studio
    networks:
      - csg-network

  dataflow_api_server:
    restart: unless-stopped
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/dataflow:20251130.1
    command: >
      sh -c "
        uvicorn data_server.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - /dataflow_data/apidata:/data/dataflow_data
    environment:
      - DATA_DIR=/data/dataflow_data
      - CSGHUB_ENDPOINT=https://hub.opencsg-stg.com
      - MAX_WORKERS=99
      - RAY_ADDRESS=auto
      - RAY_ENABLE=False
      - RAY_LOG_DIR=/home/output
      - API_SERVER=0.0.0.0
      - API_PORT=8000
      - ENABLE_OPENTELEMETRY=False
      - DATABASE_DB=data_flow
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOSTNAME=dataflow_postgres_db
      - DATABASE_PORT=5432
      - STUDIO_JUMP_URL=http://39.102.214.107:8002
      - MINERU_API_URL=http://111.4.242.20:30000
      - CSGHUB_DATAFLOW_TEMPLATE_IMAGE=opencsg_public/dataflow:argo-latest
    ports:
      - "8000:8000"
    depends_on:
      - dataflow_postgres_db
    networks:
      - csg-network

networks:
  csg-network:
    driver: bridge
